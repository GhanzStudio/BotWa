    <script>
      // When served statically on GitHub Pages root (where /src/main.tsx is not compiled by Vite),
      // seamlessly forward to the pre-compiled /docs/ dashboard
      if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/docs')) {
        var cleanPath = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
        window.location.replace(cleanPath + 'docs/');
      }
    </script>
