    <style>
      vite-error-overlay, #vite-error-overlay {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      if (typeof customElements !== 'undefined') {
        var origDef = customElements.define;
        customElements.define = function(name, constructor, options) {
          if (name === 'vite-error-overlay') return;
          return origDef.call(customElements, name, constructor, options);
        };
      }
    </script>
    <script>
      // Silences any WebSocket / HMR disconnection overlays and unhandled rejections
      (function() {
        function shouldSuppress(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('vite') !== -1 ||
            s.indexOf('ws') !== -1 ||
            s.indexOf('closed without opened') !== -1 ||
            s.indexOf('failed to connect') !== -1 ||
            s.indexOf('two children with the same key') !== -1 ||
            s.indexOf('keys should be unique') !== -1
          );
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String((a && (a.message || a.stack)) || a || ''); }).join(' ');
          if (shouldSuppress(joined)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String((a && (a.message || a.stack)) || a || ''); }).join(' ');
          if (shouldSuppress(joined)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.onerror = function(message, source, lineno, colno, error) {
          var msg = String(message || (error && error.message) || '');
          if (shouldSuppress(msg)) {
            return true;
          }
        };

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || e.reason.stack)) || String((e && e.reason) || '');
          if (shouldSuppress(msg)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (shouldSuppress(msg)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);

        // Wrap WebSocket to swallow connection errors cleanly
        try {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              var ws = new OrigWS(url, protocols);
              ws.addEventListener('error', function(e) {
                e.preventDefault && e.preventDefault();
                e.stopImmediatePropagation && e.stopImmediatePropagation();
              });
              return ws;
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        // Hide any Vite error overlay custom element if injected into DOM
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node && node.nodeName && node.nodeName.toLowerCase() === 'vite-error-overlay') {
                node.remove();
              }
            });
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
